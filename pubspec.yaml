name: daftry
description: "دفتري — دفتر حسابات شخصي وإدارة ديون، يعمل بدون تسجيل دخول وبدون إنترنت."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_contacts: ^2.5.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.0
  sqlite3: ^3.6.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # توليد ملفات الترجمة تلقائياً من lib/l10n/*.arb
  generate: true

  assets:
    - assets/fonts/

  # الخط العربي المضمَّن (رخصة OFL) — لا يُحمَّل من الإنترنت.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
